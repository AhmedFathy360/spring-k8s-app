name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/spring-k8s-app
  IMAGE_TAG: ${{ github.sha }}
  RELEASE_NAME: spring-k8s-app
  NAMESPACE: production
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    runs-on: self-hosted

    outputs:
      image-tag: ${{ env.IMAGE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:$IMAGE_TAG


  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Kubernetes connection
        run: kubectl get nodes

      - name: Clone Helm repository
        run: |
          git clone https://github.com/AhmedFathy360/spring-k8s-app-helm-chart \
            --depth 1 --branch main ./helm-repo

      - name: Deploy with Helm
        run: |
          helm upgrade --install $RELEASE_NAME ./helm-repo \
            --namespace $NAMESPACE \
            --create-namespace \
            --set image.repository=$IMAGE_NAME \
            --set image.tag=${{ needs.build.outputs.image-tag }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment \
            -l app.kubernetes.io/instance=$RELEASE_NAME \
            -n $NAMESPACE